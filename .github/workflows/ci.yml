name: Prototype CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            prototype/order_service/requirements.txt
            prototype/notification_service/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r prototype/order_service/requirements.txt -r prototype/notification_service/requirements.txt pytest
      - name: Run service tests
        run: python -m pytest prototype/order_service/test_app.py prototype/notification_service/test_consumer.py -q
      - name: Run Compose end-to-end check
        run: |
          mkdir -p evidence
          docker compose -f prototype/compose.yaml up --build -d
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f prototype/compose.yaml ps
            docker compose -f prototype/compose.yaml logs
            exit 1
          fi
          correlation_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error \
            -X POST http://localhost:8000/orders \
            -H "Content-Type: application/json" \
            -H "X-Correlation-ID: ${correlation_id}" \
            -H "Idempotency-Key: ${correlation_id}" \
            -d '{"customer_ref":"ci-customer","items":[{"sku":"lamp-1","quantity":1}]}' \
            | tee evidence/order-response.json
          python -c "import json; r=json.load(open('evidence/order-response.json')); assert r['status']=='ACCEPTED' and r['correlation_id']=='${correlation_id}'"
          consumed=0
          for attempt in $(seq 1 30); do
            docker compose -f prototype/compose.yaml logs notification > evidence/notification.log
            if grep --fixed-strings --quiet "${correlation_id}" evidence/notification.log \
              && grep --fixed-strings --quiet '"event": "notification_queued"' evidence/notification.log; then
              consumed=1
              break
            fi
            sleep 2
          done
          docker compose -f prototype/compose.yaml logs order > evidence/order.log
          if [ "$consumed" -ne 1 ]; then
            docker compose -f prototype/compose.yaml ps
            docker compose -f prototype/compose.yaml logs
            exit 1
          fi
          grep --fixed-strings --quiet "${correlation_id}" evidence/order.log
          echo "Compose order-to-notification flow passed for ${correlation_id}"
      - name: Publish real integration evidence to run summary
        if: success()
        run: |
          correlation_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "### Compose end-to-end evidence"
            echo "Correlation ID: \`${correlation_id}\`"
            echo
            echo "#### Accepted order response"
            echo '```json'
            cat evidence/order-response.json
            echo '```'
            echo
            echo "#### Order service log"
            echo '```text'
            grep --fixed-strings "${correlation_id}" evidence/order.log
            echo '```'
            echo
            echo "#### Notification consumer log"
            echo '```text'
            grep --fixed-strings "${correlation_id}" evidence/notification.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Compose services
        if: always()
        run: docker compose -f prototype/compose.yaml down --volumes
